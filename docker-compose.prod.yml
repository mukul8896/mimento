# Production stack. Note the --env-file: compose interpolates ${VAR} from that file (or the
# shell), while env_file: only injects variables into the containers. Both are needed.
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Differs from the development compose on purpose:
#   - no MinIO. Production uses an S3-compatible service with a browser-reachable endpoint
#     (Cloudflare R2 is the cheap default); a MinIO container on the private network cannot serve
#     the presigned upload URLs the browser needs.
#   - Caddy terminates TLS and is the only published port. It obtains and renews certificates
#     automatically from the DOMAIN in .env.production.
#   - Postgres keeps its data in a named volume and is published on loopback only (for manual
#     psql/pg_dump on the box), never to the internet.
#   - Migrations run in the one-off `migrate` service, so the server needs only Docker.
#   - Background jobs (upload scanning and resizing, outbox, payment reconciliation) run in
#     `worker`, the same image with a different entrypoint. `api` only serves HTTP.
#   - ClamAV scans every upload before anyone else can see it. It needs ~1.5 GB RAM and a few
#     minutes on first start to download its signature database (kept in a volume).
name: momentpath-prod

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-momentpath}
    volumes: [pgdata:/var/lib/postgresql/data]
    # 127.0.0.1 only: reachable for `pnpm db:deploy` on the box, not from outside.
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-momentpath}']
      interval: 10s
      timeout: 5s
      retries: 20

  # One-off release step, never started by `up`: applies pending migrations and the seed.
  #   docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrate
  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, target: migrate }
    profiles: [release]
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-momentpath}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, target: runtime }
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-momentpath}
      PROCESS_ROLE: api
    depends_on:
      postgres: { condition: service_healthy }
    expose: ['4000']

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile, target: runtime }
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-momentpath}
      PROCESS_ROLE: worker
      CLAMAV_HOST: clamav
    depends_on:
      postgres: { condition: service_healthy }
      clamav: { condition: service_healthy }

  clamav:
    # Official multi-arch image (the Alpine one has no arm64 build). Pinned to the 1.4 LTS line.
    image: clamav/clamav-debian:1.4
    restart: unless-stopped
    volumes: [clamdb:/var/lib/clamav]
    expose: ['3310']
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    restart: unless-stopped
    env_file: .env.production
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    expose: ['3000']

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      DOMAIN: ${DOMAIN:?set in .env.production}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [web]

volumes:
  pgdata:
  clamdb:
  caddydata:
  caddyconfig:
